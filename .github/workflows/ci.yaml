name: "CI"

# The offline suites: no secrets, no network beyond NuGet, no Catalyst account. The diagrid CLI is replaced by
# tests/FakeDiagrid. Runs on both platforms because the package is consumed on both and the fake's location,
# executable bit and PATH handling differ between them. Make this check required for merging.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: "Setup dotnet"
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.*.*

      # Analyzers run inside this build, and Directory.Build.props makes a warning fatal for the shipped package,
      # so a new CA/IDE violation in Hosting.Catalyst fails here rather than drifting in unnoticed.
      - name: "Build"
        run: dotnet build

      # The formatting rules dotnet build does not enforce (whitespace, import order, final newline, charset).
      # ubuntu only: .gitattributes pins the working tree to LF, so the verdict is the same on either runner.
      - name: "Format check"
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes --no-restore

      - name: "Unit tests"
        run: dotnet test tests/Hosting.Catalyst.Tests --no-build

      - name: "Integration tests"
        run: dotnet test tests/Hosting.Catalyst.IntegrationTests --no-build

      # Proves the opt-in tests skip without CATALYST_SMOKE_ENABLED: a skip, not a failure, and no account touched.
      - name: "Smoke tests (account-backed tests must skip; offline normaliser tests run)"
        run: dotnet test tests/Hosting.Catalyst.SmokeTests --no-build
